<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HaKING06 | Ultimate Portfolio</title>
    
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=plus-jakarta-sans@400,500,700&f[]=jetbrains-mono@400&display=swap" rel="stylesheet">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23c084fc;stop-opacity:1' /%3E%3Cstop offset='100%25' style='stop-color:%236366f1;stop-opacity:1' /%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M10 40 L30 70 L50 30 L70 70 L90 40 L85 85 H15 Z' fill='url(%23grad)' stroke='white' stroke-width='2'/%3E%3Ccircle cx='50' cy='20' r='4' fill='white' filter='drop-shadow(0 0 5px white)'/%3E%3C/svg%3E">

    <style>
        /* --- AYARLAR (Eski Teman) --- */
        :root {
            --bg-deep: #030014;
            --primary-glow: #a855f7;
            --secondary-glow: #3b82f6;
            --accent-cyan: #06b6d4;
            --neon-green: #00ff88;
            --text-main: #ffffff;
            --text-mute: #94a3b8;
            --font-head: 'Clash Display', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; cursor: none; /* Standart imleci gizle */ }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
            /* Spotlight Efekti */
            background-image: radial-gradient( circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(168, 85, 247, 0.15) 0%, transparent 45% );
            background-attachment: fixed;
        }

        /* --- HARİKA İMLEÇ (Custom Cursor) --- */
        #cursor-custom {
            position: fixed; top: 0; left: 0;
            pointer-events: none; z-index: 10000;
            mix-blend-mode: difference;
            transition: transform 0.1s ease-out;
        }
        .cursor-arrow {
            width: 24px; height: 24px;
            fill: var(--accent-cyan);
            filter: drop-shadow(0 0 5px var(--accent-cyan));
            transform-origin: top left;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        /* Hover Durumu */
        body.hovering .cursor-arrow {
            fill: var(--primary-glow);
            transform: scale(1.3) rotate(-10deg);
        }

        /* --- GİRİŞ EKRANI (Loader) --- */
        #initial-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        .loader-content { font-family: var(--font-mono); color: var(--neon-green); letter-spacing: 2px; animation: blinkText 1s infinite; font-size: 1.2rem; }

        /* --- GEÇİŞ EKRANI (Portal) --- */
        #transition-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 0, 20, 0.98); backdrop-filter: blur(20px);
            z-index: 9000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        #transition-overlay.active { opacity: 1; pointer-events: all; }
        .target-text { font-family: var(--font-head); font-size: 2rem; color: #fff; margin-bottom: 20px; text-shadow: 0 0 20px var(--primary-glow); }
        .progress-bar-wrap { width: 250px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: var(--neon-green); box-shadow: 0 0 15px var(--neon-green); transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1); }

        /* --- ARKA PLAN (Nebula) --- */
        .nebula-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; overflow: hidden; pointer-events: none; }
        .orb { position: absolute; border-radius: 50%; filter: blur(130px); opacity: 0.4; animation: drift 25s infinite alternate ease-in-out; }
        .orb-1 { width: 70vw; height: 70vw; background: #4c1d95; top: -30%; left: -20%; }
        .orb-2 { width: 60vw; height: 60vw; background: #be185d; bottom: -30%; right: -20%; animation-delay: -8s; }
        @keyframes drift { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(40px, 40px) scale(1.1); } }

        /* --- HEADER --- */
        header { width: 100%; max-width: 1200px; padding: 80px 20px 60px; display: flex; flex-direction: column; align-items: center; text-align: center; z-index: 10; }
        
        /* Logo Link (Sadece bu tıklanır) */
        .logo-link { cursor: none; transition: transform 0.3s; display: block; }
        .logo-link:hover { transform: scale(1.1); }

        .logo-wrapper { width: 120px; height: 120px; margin-bottom: 30px; filter: drop-shadow(0 0 40px rgba(168, 85, 247, 0.7)); animation: floatLogo 6s ease-in-out infinite; }
        
        /* Başlık (Tıklanmaz) */
        h1 { font-family: var(--font-head); font-size: 4.5rem; font-weight: 700; letter-spacing: 2px; color: #fff; margin-bottom: 15px; text-shadow: 0 0 20px rgba(168, 85, 247, 0.5), 0 0 50px rgba(59, 130, 246, 0.5); min-height: 1.1em; pointer-events: none; }
        h1.decoding { font-family: var(--font-mono); }
        .subtitle { font-size: 1.1rem; color: var(--text-mute); background: rgba(255,255,255,0.05); padding: 12px 32px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }

        /* --- GRID --- */
        .grid-area { width: 100%; max-width: 1300px; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 40px; padding-bottom: 120px; }

        /* --- KARTLAR --- */
        .glass-card {
            position: relative;
            background: rgba(10, 10, 15, 0.75); border-radius: 28px; padding: 2px; overflow: hidden;
            transition: transform 0.1s ease, box-shadow 0.3s ease; 
            transform-style: preserve-3d; perspective: 1000px;
            display: flex; flex-direction: column; min-height: 300px;
            box-shadow: 0 15px 40px -15px rgba(0,0,0,0.6);
        }

        .glass-card::before {
            content: ""; position: absolute; inset: 0; border-radius: 28px; padding: 2px;
            background: linear-gradient(45deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude; pointer-events: none; transition: 0.5s;
        }
        .glass-card::after {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(to bottom right, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%);
            transform: rotate(30deg) translateY(-100%);
            transition: transform 0.7s cubic-bezier(0.23, 1, 0.32, 1); pointer-events: none;
        }

        .glass-card:hover { box-shadow: 0 30px 70px -20px rgba(168, 85, 247, 0.6); }
        .glass-card:hover::before { background: linear-gradient(45deg, var(--primary-glow), var(--secondary-glow), var(--neon-green)); }
        .glass-card:hover::after { transform: rotate(30deg) translateY(100%); }

        .card-inner {
            background: rgba(20, 20, 30, 0.65); border-radius: 26px; height: 100%; width: 100%; 
            padding: 32px; display: flex; flex-direction: column; justify-content: space-between; z-index: 2;
            transform: translateZ(20px);
        }

        .project-name { font-family: var(--font-head); font-size: 1.9rem; color: #fff; margin-bottom: 12px; transition: 0.3s; }
        .glass-card:hover .project-name { text-shadow: 0 0 15px rgba(255,255,255,0.8), 0 0 30px var(--primary-glow); color: #fff; }

        .project-desc { color: var(--text-mute); font-size: 1rem; line-height: 1.7; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 25px; border-top: 1px solid rgba(255,255,255,0.08); }
        
        .live-tag { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; font-weight: 700; color: var(--neon-green); background: rgba(0, 255, 136, 0.1); padding: 10px 16px; border-radius: 14px; border: 1px solid rgba(0, 255, 136, 0.25); box-shadow: 0 0 15px rgba(0, 255, 136, 0.1); }
        .live-dot { width: 10px; height: 10px; background: var(--neon-green); border-radius: 50%; box-shadow: 0 0 15px var(--neon-green), 0 0 30px var(--neon-green); animation: blinkSuper 1.2s infinite; }

        .arrow-btn { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; color: #fff; transition: all 0.3s ease-out; }
        .glass-card:hover .arrow-btn { background: #fff; color: #000; box-shadow: 0 0 25px rgba(255,255,255,0.6); transform: rotate(-45deg); }

        footer { margin-top: auto; padding: 60px; width: 100%; text-align: center; color: var(--text-mute); border-top: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.4); backdrop-filter: blur(30px); }
        .signature { color: var(--primary-glow); font-weight: 800; letter-spacing: 1px; text-shadow: 0 0 15px var(--primary-glow); animation: neonPulse 3s infinite alternate; }

        @keyframes floatLogo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes neonPulse { 0% { text-shadow: 0 0 20px rgba(168, 85, 247, 0.5); } 100% { text-shadow: 0 0 40px rgba(168, 85, 247, 0.9); } }
        @keyframes blinkSuper { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }
        @keyframes blinkText { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(40px); scale: 0.95; } to { opacity: 1; transform: translateY(0); scale: 1; } }

        /* Mobil Optimizasyon */
        @media (max-width: 768px) {
            h1 { font-size: 3rem; } 
            .grid-area { grid-template-columns: 1fr; gap: 30px; padding: 20px; }
            .glass-card { transform: none !important; } 
            #cursor-custom { display: none; } /* Mobilde imleç gizle */
            * { cursor: auto !important; }
        }
    </style>
</head>
<body>

    <div id="cursor-custom">
        <svg class="cursor-arrow" viewBox="0 0 24 24">
            <path d="M2 2L11 20L15 13L22 10L2 2Z"/>
        </svg>
    </div>

    <div id="initial-loader">
        <div class="loader-content">SİSTEM BAŞLATILIYOR...</div>
    </div>

    <div id="transition-overlay">
        <div style="color:var(--neon-green); font-family:var(--font-mono); margin-bottom:10px;">HEDEF SUNUCUYA BAĞLANILIYOR</div>
        <div class="target-text" id="target-name">PROJECT NAME</div>
        <div class="progress-bar-wrap">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div style="color:#888; font-size:0.8rem; margin-top:20px;">Güvenli bağlantı kuruluyor...</div>
    </div>

    <div class="nebula-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <header>
        <a href="https://github.com/HaKING06" target="_blank" class="logo-link">
            <div class="logo-wrapper">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#c084fc;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path d="M10 40 L30 70 L50 30 L70 70 L90 40 L85 85 H15 Z" fill="url(#logoGradient)" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                    <circle cx="50" cy="20" r="4" fill="#fff" filter="drop-shadow(0 0 10px #fff)"/>
                </svg>
            </div>
        </a>
        
        <h1 id="main-title" class="decoding"></h1>
        <div class="subtitle">Digital Portfolio</div>
    </header>

    <main class="grid-area" id="projects">
        </main>

    <footer>
        Designed & Coded by <span class="signature">halitguns06.dev</span>
    </footer>

        <script>
        // --- 1. HARİKA İMLEÇ MANTIĞI ---
        const cursor = document.getElementById('cursor-custom');
        
        document.addEventListener('mousemove', (e) => {
            cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
            document.body.style.setProperty('--mouse-x', `${e.clientX}px`);
            document.body.style.setProperty('--mouse-y', `${e.clientY}px`);
        });

        document.addEventListener('mouseover', (e) => {
            if (e.target.closest('a') || e.target.closest('.glass-card') || e.target.closest('.logo-link')) {
                document.body.classList.add('hovering');
            } else {
                document.body.classList.remove('hovering');
            }
        });

        // --- 2. BAŞLIK DECODE EFEKTİ ---
        const titleElement = document.getElementById('main-title');
        const finalTitle = 'HaKING06';
        const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*';
        let iterations = 0;
        const decodeInterval = setInterval(() => {
            titleElement.innerText = finalTitle.split('').map((letter, index) => {
                if (index < iterations) return finalTitle[index];
                return characters[Math.floor(Math.random() * characters.length)];
            }).join('');
            if (iterations >= finalTitle.length) {
                clearInterval(decodeInterval);
                titleElement.classList.remove('decoding');
            }
            iterations += 1 / 3;
        }, 30);

        // --- 3. GEÇİŞ EKRANI (PORTAL) ---
        function triggerPortal(url, name) {
            const overlay = document.getElementById('transition-overlay');
            const targetName = document.getElementById('target-name');
            const bar = document.getElementById('progress-bar');

            targetName.innerText = name.toUpperCase();
            overlay.classList.add('active');
            
            setTimeout(() => { bar.style.width = "100%"; }, 100);

            setTimeout(() => {
                window.open(url, '_blank');
                setTimeout(() => {
                    overlay.classList.remove('active');
                    bar.style.width = "0%";
                }, 500);
            }, 1500);
        }

        // --- 4. GITHUB API (GELİŞMİŞ KONTROL) ---
        const user = 'HaKING06';
        const container = document.getElementById('projects');
        const initialLoader = document.getElementById('initial-loader');

        async function load() {
            try {
                const res = await fetch(`https://api.github.com/users/${user}/repos?sort=pushed&direction=desc`);
                const repos = await res.json();
                
                initialLoader.style.opacity = '0';
                setTimeout(() => { initialLoader.style.display = 'none'; }, 800);

                container.innerHTML = '';

                if(!repos.length) { container.innerHTML = '<p style="color:#fff;text-align:center;">Aktif proje bulunamadı.</p>'; return; }

                repos.forEach((repo, i) => {
                    // --- DÜZELTİLEN MANTIK ---
                    // 1. Manuel girilmiş bir site linki var mı?
                    const hasManualUrl = repo.homepage && repo.homepage.startsWith('http');
                    // 2. GitHub Pages aktif mi?
                    const hasPages = repo.has_pages;
                    
                    // İkisinden biri varsa LIVE sayılır
                    const isLive = hasManualUrl || hasPages;

                    // Linki belirle: Manuel varsa onu kullan, yoksa ama Pages varsa otomatik link oluştur
                    let targetUrl;
                    if (hasManualUrl) {
                        targetUrl = repo.homepage;
                    } else if (hasPages) {
                        targetUrl = `https://${user}.github.io/${repo.name}`;
                    } else {
                        targetUrl = repo.html_url; // Hiçbiri yoksa GitHub koduna git
                    }
                    
                    const desc = repo.description || "Geleceğin web teknolojileri ile geliştirildi.";

                    // Badge Tasarımı
                    const statusBadge = isLive 
                        ? `<div class="live-tag"><div class="live-dot"></div> LIVE</div>`
                        : `<div class="live-tag" style="background:rgba(255,255,255,0.05); border-color:rgba(255,255,255,0.1); color:#94a3b8;"><div class="live-dot" style="background:#64748b; box-shadow:none; animation:none;"></div> CODE</div>`;

                    const card = document.createElement('div');
                    card.className = "glass-card";
                    card.style.animation = `fadeUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards ${i * 0.1}s`;
                    card.style.opacity = '0';

                    card.innerHTML = `
                        <div class="card-inner">
                            <div>
                                <div class="project-name">${repo.name}</div>
                                <p class="project-desc">${desc}</p>
                            </div>
                            <div class="card-footer">
                                ${statusBadge}
                                <div class="arrow-btn">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                        <path d="M7 17L17 7M17 7H7M17 7V17"/>
                                    </svg>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    card.addEventListener('mousemove', (e) => {
                        const rect = card.getBoundingClientRect();
                        const x = e.clientX - rect.left; 
                        const y = e.clientY - rect.top;
                        const centerX = rect.width / 2;
                        const centerY = rect.height / 2;
                        const rotateX = (centerY - y) / 20; 
                        const rotateY = (x - centerX) / 20;
                        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
                    });

                    card.addEventListener('mouseleave', () => {
                        card.style.transform = `perspective(1000px) rotateX(0) rotateY(0) scale3d(1, 1, 1)`;
                    });

                    card.addEventListener('click', () => {
                        triggerPortal(targetUrl, repo.name);
                    });

                    container.appendChild(card);
                });
            } catch(e) { console.error(e); }
        }
        load();
    </script>
</body>
</html>
